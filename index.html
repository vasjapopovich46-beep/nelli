<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

:root{
  --black:#080808;
  --soft:#111111;
  --gold:#c7a56a;
  --gold2:#e0c58d;
  --white:#f7f5f1;
  --gray:#aaa59c;
  --line:rgba(199,165,106,.22);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--black);
  color:var(--white);
  font-family:"Montserrat",sans-serif;
  font-weight:300;
  line-height:1.7;
}

a{
  color:inherit;
  text-decoration:none;
}

img{
  display:block;
  max-width:100%;
}

button,
input,
textarea,
select{
  font:inherit;
}

.container{
  width:min(1180px,calc(100% - 40px));
  margin:auto;
}

/* ================= HEADER ================= */

header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;

  background:rgba(8,8,8,.88);
  backdrop-filter:blur(14px);

  border-bottom:1px solid var(--line);
}

.nav{
  min-height:82px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:25px;
}

.logo{
  display:flex;
  align-items:center;
  gap:13px;
  flex-shrink:0;
}

.logo img{
  width:56px;
  height:56px;
  object-fit:contain;

  border:none;
  outline:none;
  box-shadow:none;
  border-radius:0;
}

.logo-text{
  letter-spacing:5px;
  font-size:21px;
}

.logo-sub{
  display:block;
  color:var(--gold);
  font-size:8px;
  letter-spacing:4px;
  margin-top:-3px;
}

.nav-right{
  display:flex;
  align-items:center;
  gap:28px;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:25px;
}

.nav-links a{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.6px;
  color:#d5d1ca;
  transition:.25s;
}

.nav-links a:hover{
  color:var(--gold2);
}

/* LANGUAGE */

.languages{
  display:flex;
  align-items:center;
  gap:5px;
}

.lang-btn{
  border:1px solid transparent;
  background:transparent;

  color:#777;
  cursor:pointer;

  padding:6px 7px;

  font-size:9px;
  letter-spacing:1px;

  transition:.25s;
}

.lang-btn:hover{
  color:var(--gold2);
}

.lang-btn.active{
  color:var(--gold2);
  border-color:var(--line);
}

/* ================= HERO ================= */

.hero{
  min-height:100vh;

  display:flex;
  align-items:center;

  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 75% 40%,
      rgba(199,165,106,.10),
      transparent 32%
    ),
    var(--black);
}

.hero::after{
  content:"NELLI";

  position:absolute;
  right:-80px;
  bottom:-100px;

  font-family:"Cormorant Garamond",serif;
  font-size:250px;

  color:rgba(255,255,255,.025);

  pointer-events:none;
}

.hero-content{
  padding-top:80px;
  max-width:720px;
}

.eyebrow{
  color:var(--gold);
  font-size:10px;
  letter-spacing:5px;
  text-transform:uppercase;
  margin-bottom:22px;
}

.hero h1{
  font-family:"Cormorant Garamond",serif;
  font-size:clamp(72px,12vw,150px);
  font-weight:300;
  line-height:.76;
  letter-spacing:-3px;
  margin-bottom:35px;
}

.hero h1 span{
  color:var(--gold);
  font-style:italic;
}

.hero-description{
  color:var(--gray);
  max-width:520px;
  font-size:14px;
  margin-bottom:35px;
}

.hero-button{
  display:inline-flex;
  align-items:center;
  gap:18px;

  border:1px solid var(--gold);
  padding:15px 25px;

  color:var(--gold2);

  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;

  transition:.3s;
}

.hero-button:hover{
  background:var(--gold);
  color:var(--black);
}

.scroll{
  position:absolute;
  bottom:30px;
  left:20px;

  color:#777;
  font-size:9px;
  letter-spacing:3px;
  text-transform:uppercase;
}

/* ================= GENERAL ================= */

section{
  padding:120px 0;
}

.section-title{
  margin-bottom:55px;
}

.section-title h2{
  font-family:"Cormorant Garamond",serif;
  font-size:clamp(50px,7vw,85px);
  font-weight:300;
  line-height:.9;
}

.section-title h2 span{
  color:var(--gold);
  font-style:italic;
}

/* ================= ABOUT ================= */

.about{
  background:var(--soft);
}

.about-grid{
  display:grid;
  grid-template-columns:1fr 1.15fr;
  gap:90px;
  align-items:center;
}

.about-photo{
  min-height:570px;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  background:#151310;
}

.about-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.about-text p{
  color:var(--gray);
  font-size:14px;
  margin-bottom:20px;
  max-width:600px;
}

.signature{
  margin-top:35px;

  font-family:"Cormorant Garamond",serif;
  font-size:40px;
  color:var(--gold);
  font-style:italic;
}

/* ================= PORTFOLIO ================= */

.portfolio-grid{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:12px;
}

.portfolio-item{
  min-height:360px;
  position:relative;
  overflow:hidden;
  background:#181614;
}

.portfolio-item:nth-child(1){
  grid-column:span 7;
  min-height:550px;
}

.portfolio-item:nth-child(2){
  grid-column:span 5;
  min-height:550px;
}

.portfolio-item:nth-child(3),
.portfolio-item:nth-child(4),
.portfolio-item:nth-child(5){
  grid-column:span 4;
}

.portfolio-placeholder{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #29241f,
      #0d0c0b
    );

  color:rgba(199,165,106,.25);

  font-family:"Cormorant Garamond",serif;
  font-size:70px;
}

.portfolio-caption{
  position:absolute;
  left:22px;
  bottom:20px;

  text-shadow:0 3px 15px #000;
}

.portfolio-caption small{
  color:var(--gold2);
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.portfolio-caption strong{
  display:block;

  font-family:"Cormorant Garamond",serif;
  font-size:29px;
  font-weight:400;
}

/* ================= SERVICES ================= */

.services{
  background:var(--soft);
}

.services-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1px;
  background:var(--line);
}

.service{
  background:var(--soft);
  padding:45px 35px;
  min-height:300px;

  transition:.3s;
}

.service:hover{
  background:#171512;
}

.service-number{
  color:var(--gold);
  font-family:"Cormorant Garamond",serif;
  font-size:35px;
}

.service h3{
  font-family:"Cormorant Garamond",serif;
  font-size:38px;
  font-weight:400;
  margin:45px 0 15px;
}

.service p{
  color:var(--gray);
  font-size:13px;
}

/* ================= CONTACT ================= */

.contact{
  background:
    radial-gradient(
      circle at 80% 30%,
      rgba(199,165,106,.07),
      transparent 35%
    ),
    var(--black);
}

.contact-grid{
  display:grid;
  grid-template-columns:.8fr 1.2fr;
  gap:80px;
}

.contact-info p{
  color:var(--gray);
  font-size:14px;
  max-width:450px;
  margin-bottom:30px;
}

.contact-links{
  display:grid;
  gap:12px;
}

.contact-links a{
  color:var(--gold2);
  font-size:13px;
}

/* FORM */

.booking-form{
  border:1px solid var(--line);
  padding:40px;
  background:rgba(255,255,255,.015);
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.field{
  display:grid;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  color:#aaa49a;
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.field input,
.field select,
.field textarea{
  width:100%;

  border:1px solid rgba(255,255,255,.13);

  background:#0d0d0d;
  color:white;

  padding:13px 14px;

  outline:none;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--gold);
}

.field textarea{
  min-height:130px;
  resize:vertical;
}

.submit-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-top:25px;
  gap:20px;
}

.submit-button{
  border:1px solid var(--gold);
  background:var(--gold);
  color:#090909;

  padding:14px 24px;

  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;

  cursor:pointer;
  transition:.3s;
}

.submit-button:hover{
  background:transparent;
  color:var(--gold2);
}

.submit-button:disabled{
  opacity:.5;
  cursor:wait;
}

#formMessage{
  color:var(--gold2);
  font-size:12px;
}

/* ================= CLIENT PROFILE ================= */

.client-profile{
  display:none;

  margin-top:40px;
  padding:30px;

  border:1px solid var(--line);
  background:#0e0e0e;
}

.client-profile.visible{
  display:block;
}

.client-profile h3{
  font-family:"Cormorant Garamond",serif;
  font-size:34px;
  color:var(--gold2);
  font-weight:400;
  margin-bottom:20px;
}

.profile-row{
  display:grid;
  grid-template-columns:160px 1fr;

  padding:9px 0;

  border-bottom:1px solid rgba(255,255,255,.07);

  font-size:12px;
}

.profile-row span:first-child{
  color:#777;
}

.profile-row span:last-child{
  color:#ddd;
}

/* ================= FOOTER ================= */

footer{
  padding:45px 0;
  border-top:1px solid var(--line);
}

.footer-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.footer-logo{
  color:var(--gold);
  letter-spacing:5px;
  font-size:18px;
}

.footer-copy{
  color:#666;
  font-size:10px;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

  .nav-links{
    display:none;
  }

  .nav-right{
    margin-left:auto;
  }

  .about-grid,
  .contact-grid{
    grid-template-columns:1fr;
  }

  .services-grid{
    grid-template-columns:1fr;
  }

  .about-photo{
    min-height:420px;
  }

}

@media(max-width:650px){

  .container{
    width:calc(100% - 28px);
  }

  section{
    padding:80px 0;
  }

  .hero h1{
    font-size:80px;
  }

  .portfolio-grid{
    display:grid;
    grid-template-columns:1fr;
  }

  .portfolio-item,
  .portfolio-item:nth-child(n){
    grid-column:span 1;
    min-height:380px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .booking-form{
    padding:24px;
  }

  .submit-row{
    flex-direction:column;
    align-items:stretch;
  }

  .submit-button{
    width:100%;
  }

  .footer-inner{
    flex-direction:column;
    align-items:flex-start;
  }

  .languages{
    gap:1px;
  }

  .lang-btn{
    padding:5px 4px;
  }

}

</style>
</head>

/* =====================================================
   LANGUAGE SYSTEM
===================================================== */

let currentLanguage =
localStorage.getItem("nelli-language") || "uk";


function setLanguage(language){

  if(!translations[language]){
    language="uk";
  }

  currentLanguage=language;

  localStorage.setItem(
    "nelli-language",
    language
  );

  document.documentElement.lang =
    language === "cz" ? "cs" : language;


  const dictionary =
    translations[language];


  document
    .querySelectorAll("[data-i18n]")
    .forEach(element=>{

      const key =
        element.getAttribute("data-i18n");

      if(dictionary[key] !== undefined){

        element.textContent =
          dictionary[key];

      }

    });


  document
    .querySelectorAll("[data-placeholder]")
    .forEach(element=>{

      const key =
        element.getAttribute("data-placeholder");

      if(dictionary[key] !== undefined){

        element.placeholder =
          dictionary[key];

      }

    });


  document
    .querySelectorAll(".lang-btn")
    .forEach(button=>{

      button.classList.toggle(
        "active",
        button.dataset.lang === language
      );

    });


  updateFormMessage();


  /*
    Якщо профіль вже відкритий,
    його заголовки теж автоматично
    перемикаються завдяки data-i18n.
  */

}


document
  .querySelectorAll(".lang-btn")
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{

        setLanguage(
          button.dataset.lang
        );

      }
    );

  });

===================================================== */

/*
  Тут пізніше поставимо справжній
  URL твоєї hosted Supabase.

  НЕ вставляємо service_role key
  у публічний сайт.
*/

const SUPABASE_URL =
  "http://127.0.0.1:54321";

const SUPABASE_KEY =
  "sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH";


let supabaseClient=null;


if(
  window.supabase &&
  SUPABASE_URL &&
  SUPABASE_KEY
){

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

}


/* =====================================================
   FORM
===================================================== */

const form =
  document.getElementById(
    "bookingForm"
  );


const formMessage =
  document.getElementById(
    "formMessage"
  );


const submitButton =
  document.getElementById(
    "submitButton"
  );


const clientProfile =
  document.getElementById(
    "clientProfile"
  );


function updateFormMessage(){

  /*
    Не стираємо успішне повідомлення
    при простому перемиканні мови,
    якщо воно вже показане.
  */

}


form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const dictionary =
      translations[currentLanguage];


    formMessage.textContent =
      dictionary.sending;


    submitButton.disabled=true;


    const data =
      new FormData(form);


    const client={

      name:
        String(data.get("name") || "").trim(),

      phone:
        String(data.get("phone") || "").trim(),

      email:
        String(data.get("email") || "").trim() || null,

      service:
        String(data.get("service") || "") || null,

      date:
        String(data.get("date") || "") || null,

      notes:
        String(data.get("message") || "").trim() || null

    };


    /*
      Якщо база ще не підключена,
      показуємо зрозуміле повідомлення.
    */

    if(!supabaseClient){

      formMessage.textContent =
        dictionary.error;

      submitButton.disabled=false;

      return;

    }


    const result =
      await supabaseClient
        .from("clients")
        .insert(client)
        .select()
        .single();


    if(result.error){

      console.error(
        "Supabase error:",
        result.error
      );


      formMessage.textContent =
        dictionary.error;


      submitButton.disabled=false;

      return;

    }


    /*
      Показуємо профіль клієнта
      після успішного створення.
    */

    const savedClient =
      result.data;


    document.getElementById(
      "profileName"
    ).textContent =
      savedClient.name || "—";


    document.getElementById(
      "profilePhone"
    ).textContent =
      savedClient.phone || "—";


    document.getElementById(
      "profileEmail"
    ).textContent =
      savedClient.email || "—";


    document.getElementById(
      "profileService"
    ).textContent =
      savedClient.service || "—";


    document.getElementById(
      "profileDate"
    ).textContent =
      savedClient.date || "—";


    document.getElementById(
      "profileStatus"
    ).textContent =
      dictionary.statusNew;


    clientProfile.classList.add(
      "visible"
    );


    formMessage.textContent =
      dictionary.success;


    form.reset();


    submitButton.disabled=false;


    clientProfile.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

  }
);


/* =====================================================
   START

setLanguage(currentLanguage);

</script>
