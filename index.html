/* =========================================================
   LANGUAGE
========================================================= */

let currentLanguage =
    localStorage.getItem("nelli-language") || "uk";


function setLanguage(language){

    const t = translations[language];

    if(!t) return;

    currentLanguage = language;

    localStorage.setItem(
        "nelli-language",
        language
    );

    document.documentElement.lang =
        language === "cz" ? "cs" : language;

    document
        .querySelectorAll("[data-t]")
        .forEach(el=>{

            const key = el.dataset.t;

            if(t[key] !== undefined){
                el.textContent = t[key];
            }

        });

    document
        .querySelectorAll("[data-placeholder]")
        .forEach(el=>{

            const key = el.dataset.placeholder;

            if(t[key] !== undefined){
                el.placeholder = t[key];
            }

        });

    document
        .querySelectorAll(".lang")
        .forEach(btn=>{

            btn.classList.toggle(
                "active",
                btn.dataset.lang === language
            );

        });

    updateStatusMessage();
}


document
    .querySelectorAll(".lang")
    .forEach(btn=>{

        btn.addEventListener(
            "click",
            ()=>{
                setLanguage(
                    btn.dataset.lang
                );
            }
        );

    });


/* =========================================================
   FORM
========================================================= */

const form =
    document.getElementById("bookingForm");

const formMessage =
    document.getElementById("formMessage");

const submitButton =
    document.getElementById("submitButton");

const clientProfile =
    document.getElementById("clientProfile");

let currentStatus = "";


function updateStatusMessage(){

    const t =
        translations[currentLanguage];

    if(currentStatus === "sending"){
        formMessage.textContent = t.sending;
    }

    else if(currentStatus === "success"){
        formMessage.textContent = t.success;
    }

    else if(currentStatus === "error"){
        formMessage.textContent = t.error;
    }

    else{
        formMessage.textContent = "";
    }
}


/* =========================================================
   SHOW CLIENT PROFILE
========================================================= */

function showProfile(client){

    document.getElementById(
        "profileName"
    ).textContent =
        client.full_name || "—";

    document.getElementById(
        "profilePhone"
    ).textContent =
        client.phone || "—";

    document.getElementById(
        "profileEmail"
    ).textContent =
        client.email || "—";

    document.getElementById(
        "profileStatus"
    ).textContent =
        translations[currentLanguage].newClient;

    clientProfile.classList.add("show");
}


/* =========================================================
   SEND CLIENT TO SUPABASE
========================================================= */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const fullName =
            document
                .getElementById("name")
                .value
                .trim();

        const phone =
            document
                .getElementById("phone")
                .value
                .trim();

        const email =
            document
                .getElementById("email")
                .value
                .trim();


        if(!fullName || !phone){

            currentStatus = "error";
            updateStatusMessage();

            return;
        }


        currentStatus = "sending";
        updateStatusMessage();

        submitButton.disabled = true;


        try{

            const response =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/clients",
                    {
                        method:"POST",

                        headers:{
                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY,

                            "Content-Type":
                                "application/json",

                            "Prefer":
                                "return=representation"
                        },

                        body:JSON.stringify({

                            full_name:
                                fullName,

                            phone:
                                phone,

                            email:
                                email

                        })
                    }
                );


            const text =
                await response.text();


            let data;

            try{
                data = JSON.parse(text);
            }
            catch{
                data = text;
            }


            console.log(
                "Supabase response:",
                response.status,
                data
            );


            if(!response.ok){

                throw new Error(
                    typeof data === "object"
                        ? (
                            data.message ||
                            data.error ||
                            JSON.stringify(data)
                          )
                        : data
                );
            }


            const client =
                Array.isArray(data)
                    ? data[0]
                    : data;


            currentStatus = "success";
            updateStatusMessage();


            showProfile(client);


            localStorage.setItem(
                "nelli-last-client",
                JSON.stringify(client)
            );


            form.reset();


        }

        catch(error){

            console.error(
                "SUPABASE ERROR:",
                error
            );

            currentStatus = "error";
            updateStatusMessage();

        }

        finally{

            submitButton.disabled = false;

        }

    }
);


/* =========================================================
   RESTORE LAST CLIENT PROFILE
========================================================= */

try{

    const saved =
        localStorage.getItem(
            "nelli-last-client"
        );

    if(saved){

        const client =
            JSON.parse(saved);

        showProfile(client);

    }

}
catch(error){

    console.log(
        "No saved client profile"
    );

}


/* =========================================================
   START
========================================================= */

setLanguage(currentLanguage);

</script>
