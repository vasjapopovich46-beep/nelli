<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nelli Photography</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#080808;
  --bg2:#11100f;
  --bg3:#171513;
  --gold:#c9a66b;
  --gold-light:#e4c992;
  --text:#f5f1e9;
  --muted:#a6a098;
  --border:rgba(201,166,107,.22);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:"Montserrat",sans-serif;
  font-weight:300;
  line-height:1.7;
}

body,
button,
input,
textarea,
select{
  -webkit-font-smoothing:antialiased;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

img{
  max-width:100%;
  display:block;
}

/* =========================
   HEADER
========================= */

header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:1000;

  background:rgba(8,8,8,.84);
  backdrop-filter:blur(18px);

  border-bottom:1px solid var(--border);
}

.nav{
  width:min(1180px,calc(100% - 40px));
  min-height:82px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:30px;
}

.logo{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo img{
  width:55px;
  height:55px;

  object-fit:contain;

  border:0 !important;
  outline:0 !important;
  box-shadow:none !important;
  border-radius:0 !important;
}

.logo-name{
  font-size:20px;
  letter-spacing:5px;
}

.logo-sub{
  display:block;
  color:var(--gold);
  font-size:8px;
  letter-spacing:4px;
  margin-top:-3px;
}

.nav-right{
  display:flex;
  align-items:center;
  gap:25px;
}

.nav-links{
  display:flex;
  gap:25px;
}

.nav-links a{
  font-size:9px;
  letter-spacing:1.8px;
  text-transform:uppercase;
  color:#d0cbc3;
  transition:.25s;
}

.nav-links a:hover{
  color:var(--gold-light);
}

/* =========================
   LANGUAGE
========================= */

.languages{
  display:flex;
  align-items:center;
  gap:4px;
}

.lang{
  border:1px solid transparent;
  background:transparent;
  color:#777;
  padding:6px 7px;
  cursor:pointer;
  font-size:9px;
  letter-spacing:1px;
  transition:.25s;
}

.lang:hover{
  color:var(--gold-light);
}

.lang.active{
  color:var(--gold-light);
  border-color:var(--border);
}

/* =========================
   HERO
========================= */

.hero{
  min-height:100vh;
  position:relative;
  overflow:hidden;

  display:flex;
  align-items:center;

  background:
    radial-gradient(
      circle at 76% 42%,
      rgba(201,166,107,.11),
      transparent 32%
    ),
    var(--bg);
}

.hero::before{
  content:"NELLI";

  position:absolute;
  right:-90px;
  bottom:-110px;

  font-family:"Cormorant Garamond",serif;
  font-size:270px;
  font-weight:300;

  color:rgba(255,255,255,.025);

  pointer-events:none;
}

.hero-inner{
  width:min(1180px,calc(100% - 40px));
  margin:auto;
  padding-top:90px;
}

.eyebrow{
  color:var(--gold);
  font-size:9px;
  letter-spacing:5px;
  text-transform:uppercase;
  margin-bottom:24px;
}

.hero h1{
  font-family:"Cormorant Garamond",serif;
  font-size:clamp(80px,13vw,155px);
  line-height:.75;
  font-weight:300;
  letter-spacing:-4px;
  margin-bottom:40px;
}

.hero h1 span{
  color:var(--gold);
  font-style:italic;
}

.hero-text{
  max-width:550px;
  color:var(--muted);
  font-size:13px;
  margin-bottom:35px;
}

.main-button{
  display:inline-flex;
  align-items:center;
  gap:20px;

  padding:15px 25px;

  border:1px solid var(--gold);

  color:var(--gold-light);

  text-transform:uppercase;
  letter-spacing:2px;
  font-size:9px;

  transition:.3s;
}

.main-button:hover{
  background:var(--gold);
  color:#080808;
}

.hero-scroll{
  position:absolute;
  left:25px;
  bottom:30px;

  color:#666;
  font-size:8px;
  letter-spacing:3px;
  text-transform:uppercase;
}

/* =========================
   SECTIONS
========================= */

section{
  padding:120px 0;
}

.container{
  width:min(1180px,calc(100% - 40px));
  margin:auto;
}

.section-head{
  margin-bottom:55px;
}

.section-head .eyebrow{
  margin-bottom:18px;
}

.section-head h2{
  font-family:"Cormorant Garamond",serif;
  font-size:clamp(55px,7vw,90px);
  line-height:.85;
  font-weight:300;
  letter-spacing:-2px;
}

.section-head h2 span{
  color:var(--gold);
  font-style:italic;
}

/* =========================
   ABOUT
========================= */

.about{
  background:var(--bg2);
}

.about-grid{
  display:grid;
  grid-template-columns:.9fr 1.1fr;
  gap:90px;
  align-items:center;
}

.about-photo{
  height:600px;
  overflow:hidden;
  background:#171411;
}

.about-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.about-copy p{
  max-width:600px;
  color:var(--muted);
  font-size:13px;
  margin-bottom:20px;
}

.signature{
  margin-top:30px;

  font-family:"Cormorant Garamond",serif;
  font-size:42px;
  color:var(--gold);
  font-style:italic;
}

/* =========================
   PORTFOLIO
========================= */

.portfolio-grid{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:12px;
}

.work{
  position:relative;
  overflow:hidden;
  background:#151310;
  min-height:380px;
}

.work:nth-child(1){
  grid-column:span 7;
  min-height:560px;
}

.work:nth-child(2){
  grid-column:span 5;
  min-height:560px;
}

.work:nth-child(3),
.work:nth-child(4),
.work:nth-child(5){
  grid-column:span 4;
}

.work img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .7s ease;
}

.work:hover img{
  transform:scale(1.04);
}

.work-placeholder{
  width:100%;
  height:100%;
  min-height:inherit;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(135deg,#28231e,#0d0c0b);

  color:rgba(201,166,107,.18);

  font-family:"Cormorant Garamond",serif;
  font-size:80px;
}

.work::after{
  content:"";
  position:absolute;
  inset:0;

  background:linear-gradient(
    transparent 45%,
    rgba(0,0,0,.75)
  );
}

.work-info{
  position:absolute;
  z-index:2;
  left:22px;
  bottom:20px;
}

.work-info small{
  display:block;
  color:var(--gold-light);
  font-size:8px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.work-info strong{
  display:block;
  font-family:"Cormorant Garamond",serif;
  font-size:30px;
  font-weight:400;
}

/* =========================
   SERVICES
========================= */

.services{
  background:var(--bg2);
}

.services-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1px;
  background:var(--border);
}

.service{
  min-height:310px;
  padding:42px 35px;
  background:var(--bg2);
  transition:.3s;
}

.service:hover{
  background:#181613;
}

.service-number{
  color:var(--gold);
  font-family:"Cormorant Garamond",serif;
  font-size:34px;
}

.service h3{
  margin:42px 0 14px;

  font-family:"Cormorant Garamond",serif;
  font-size:38px;
  font-weight:400;
}

.service p{
  color:var(--muted);
  font-size:12px;
}

/* =========================
   CONTACT
========================= */

.contact{
  background:
    radial-gradient(
      circle at 80% 30%,
      rgba(201,166,107,.08),
      transparent 34%
    ),
    var(--bg);
}

.contact-grid{
  display:grid;
  grid-template-columns:.8fr 1.2fr;
  gap:80px;
}

.contact-copy p{
  color:var(--muted);
  font-size:13px;
  max-width:450px;
  margin-bottom:30px;
}

.contact-links{
  display:grid;
  gap:12px;
}

.contact-links a{
  color:var(--gold-light);
  font-size:12px;
}

/* =========================
   FORM
========================= */

.booking{
  padding:40px;

  border:1px solid var(--border);
  background:rgba(255,255,255,.015);
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.field{
  display:grid;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  color:#8e8981;
  font-size:8px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.field input,
.field textarea,
.field select{
  width:100%;

  padding:13px 14px;

  background:#0d0d0d;
  color:#eee;

  border:1px solid rgba(255,255,255,.12);

  outline:none;

  border-radius:0;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--gold);
}

.field textarea{
  min-height:130px;
  resize:vertical;
}

.submit-line{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:20px;
  margin-top:25px;
}

#formMessage{
  color:var(--gold-light);
  font-size:11px;
}

.submit{
  border:1px solid var(--gold);
  background:var(--gold);
  color:#080808;

  padding:14px 25px;

  cursor:pointer;

  text-transform:uppercase;
  letter-spacing:2px;
  font-size:9px;

  transition:.3s;
}

.submit:hover{
  background:transparent;
  color:var(--gold-light);
}

.submit:disabled{
  opacity:.5;
  cursor:wait;
}

/* =========================
   CLIENT PROFILE
========================= */

.client-profile{
  display:none;

  margin-top:35px;
  padding:30px;

  border:1px solid var(--border);
  background:#0e0e0e;
}

.client-profile.show{
  display:block;
}

.client-profile h3{
  margin-bottom:20px;

  color:var(--gold-light);

  font-family:"Cormorant Garamond",serif;
  font-size:34px;
  font-weight:400;
}

.profile-row{
  display:grid;
  grid-template-columns:160px 1fr;

  padding:10px 0;

  border-bottom:1px solid rgba(255,255,255,.07);

  font-size:11px;
}

.profile-row span:first-child{
  color:#777;
}

.profile-row span:last-child{
  color:#ddd;
}

/* =========================
   FOOTER
========================= */

footer{
  padding:45px 0;
  border-top:1px solid var(--border);
}

.footer{
  width:min(1180px,calc(100% - 40px));
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.footer-name{
  color:var(--gold);
  letter-spacing:5px;
  font-size:17px;
}

.footer-copy{
  color:#666;
  font-size:9px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  .nav-links{
    display:none;
  }

  .about-grid,
  .contact-grid{
    grid-template-columns:1fr;
  }

  .services-grid{
    grid-template-columns:1fr;
  }

  .about-photo{
    height:500px;
  }

}

@media(max-width:650px){

  .nav{
    width:calc(100% - 25px);
  }

  .container,
  .hero-inner,
  .footer{
    width:calc(100% - 25px);
  }

  .logo-name{
    font-size:17px;
  }

  .logo-sub{
    font-size:6px;
  }

  .logo img{
    width:48px;
    height:48px;
  }

  .languages{
    gap:0;
  }

  .lang{
    padding:5px 4px;
    font-size:8px;
  }

  section{
    padding:80px 0;
  }

  .hero h1{
    font-size:78px;
  }

  .portfolio-grid{
    grid-template-columns:1fr;
  }

  .work,
  .work:nth-child(1),
  .work:nth-child(2),
  .work:nth-child(3),
  .work:nth-child(4),
  .work:nth-child(5){
    grid-column:span 1;
    min-height:380px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .booking{
    padding:23px;
  }

  .submit-line{
    flex-direction:column;
    align-items:stretch;
  }

  .submit{
    width:100%;
  }

  .footer{
    flex-direction:column;
    align-items:flex-start;
  }

}

</style>
</head>

const translations = {

/* =========================
   LANGUAGE ENGINE
========================= */

let currentLanguage =
localStorage.getItem("nelli-language") || "uk";


function translatePage(language){

  if(!translations[language]){
    language="uk";
  }

  currentLanguage=language;

  localStorage.setItem(
    "nelli-language",
    language
  );

  document.documentElement.lang =
    language === "cz" ? "cs" : language;

  const t=translations[language];


  document
    .querySelectorAll("[data-t]")
    .forEach(element=>{

      const key=element.dataset.t;

      if(t[key] !== undefined){
        element.textContent=t[key];
      }

    });


  document
    .querySelectorAll("[data-p]")
    .forEach(element=>{

      const key=element.dataset.p;

      if(t[key] !== undefined){
        element.placeholder=t[key];
      }

    });


  document
    .querySelectorAll(".lang")
    .forEach(button=>{

      button.classList.toggle(
        "active",
        button.dataset.language===language
      );

    });


  updateStatusMessage();

}


document
  .querySelectorAll(".lang")
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{

        translatePage(
          button.dataset.language
        );

      }
    );

  });


/* =========================
   FORM
========================= */

const form=
  document.getElementById("bookingForm");

const message=
  document.getElementById("formMessage");

const submit=
  document.getElementById("submit");

const profile=
  document.getElementById("clientProfile");

let statusType="";


function updateStatusMessage(){

  if(!statusType){
    return;
  }

  const t=
    translations[currentLanguage];

  if(statusType==="sending"){
    message.textContent=t.sending;
  }

  if(statusType==="success"){
    message.textContent=t.success;
  }

  if(statusType==="error"){
    message.textContent=t.error;
  }

}


form.addEventListener(
  "submit",
  function(event){

    event.preventDefault();

    statusType="success";

    updateStatusMessage();


    const formData=
      new FormData(form);


    const name=
      formData.get("name") || "";

    const phone=
      formData.get("phone") || "";

    const email=
      formData.get("email") || "";

    const service=
      document.getElementById("service");

    const serviceText=
      service.options[
        service.selectedIndex
      ]?.text || "";

    const date=
      formData.get("date") || "";


    /*
      Поки основний сайт доводимо до готового вигляду,
      дані тимчасово зберігаються локально.
      
      Наступним етапом підключимо цю форму
      до тієї самої Supabase-бази, яку буде
      використовувати адмінка.
    */

    const client={
      name,
      phone,
      email,
      service:serviceText,
      date,
      createdAt:new Date().toISOString()
    };


    localStorage.setItem(
      "nelli-last-client",
      JSON.stringify(client)
    );


    document.getElementById(
      "profileName"
    ).textContent=name || "—";

    document.getElementById(
      "profilePhone"
    ).textContent=phone || "—";

    document.getElementById(
      "profileEmail"
    ).textContent=email || "—";

    document.getElementById(
      "profileService"
    ).textContent=serviceText || "—";

    document.getElementById(
      "profileDate"
    ).textContent=date || "—";

    document.getElementById(
      "profileStatus"
    ).textContent=
      translations[currentLanguage].newStatus;


    profile.classList.add("show");

    form.reset();

    profile.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

  }
);


/* =========================
   RESTORE LAST PROFILE
========================= */

const savedClient=
  localStorage.getItem(
    "nelli-last-client"
  );


if(savedClient){

  try{

    const client=
      JSON.parse(savedClient);

    document.getElementById(
      "profileName"
    ).textContent=
      client.name || "—";

    document.getElementById(
      "profilePhone"
    ).textContent=
      client.phone || "—";

    document.getElementById(
      "profileEmail"
    ).textContent=
      client.email || "—";

    document.getElementById(
      "profileService"
    ).textContent=
      client.service || "—";

    document.getElementById(
      "profileDate"
    ).textContent=
      client.date || "—";

  }catch(error){

    console.log(
      "Saved client data unavailable."
    );

  }

}


/* =========================
   START
========================= */

translatePage(
  currentLanguage
);

</script>
